basePath: /
definitions:
  models.Cliente:
    properties:
      email:
        type: string
      empresa:
        type: string
      id:
        type: integer
      nombre:
        type: string
      telefono:
        type: string
    type: object
  utils.APIError:
    properties:
      detail:
        example: El campo 'email' es obligatorio
        type: string
      message:
        example: Datos de entrada inválidos
        type: string
      status:
        example: 400
        type: integer
    type: object
  utils.PaginatedResponse:
    properties:
      data: {}
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 50
        type: integer
      total_pages:
        example: 5
        type: integer
    type: object
host: localhost:8443
info:
  contact: {}
  description: API usando MVC.
  title: API de Clientes (Arquitectura por Capas)
  version: "1.0"
paths:
  /clientes:
    get:
      parameters:
      - description: Filtrar por empresa
        in: query
        name: empresa
        type: string
      - description: 'Número de página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Cantidad por página (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginatedResponse'
      summary: Obtener clientes
      tags:
      - clientes
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos del cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/models.Cliente'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Cliente'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIError'
      security:
      - ApiKeyAuth: []
      summary: Agregar un cliente
      tags:
      - clientes
  /clientes/{id}:
    delete:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIError'
      security:
      - ApiKeyAuth: []
      summary: Eliminar un cliente
      tags:
      - clientes
    put:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: Datos
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/models.Cliente'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Cliente'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIError'
      security:
      - ApiKeyAuth: []
      summary: Actualizar un cliente
      tags:
      - clientes
  /clientes/masivo:
    post:
      consumes:
      - application/json
      parameters:
      - description: Array de clientes
        in: body
        name: clientes
        required: true
        schema:
          items:
            $ref: '#/definitions/models.Cliente'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIError'
      security:
      - ApiKeyAuth: []
      summary: Agregar masivo
      tags:
      - clientes
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
